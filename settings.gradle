pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	resolutionStrategy {
		eachPlugin {
			// Older Loom releases ship without a plugin marker artifact, so map the
			// plugin id to the implementation module explicitly.
			if (requested.id.id == 'fabric-loom') {
				useModule("net.fabricmc:fabric-loom:${requested.version}")
			}
		}
	}
}

rootProject.name = 'xmc-mcserver-core'
