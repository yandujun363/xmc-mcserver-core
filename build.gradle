plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
	// Loom adds the Fabric and Minecraft repositories automatically.
}

loom {
	mods {
		"xmc-mcserver-core" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			// Feature split requested for the repository:
			//   lib    - Minecraft / Fabric integration and wrapped APIs
			//   config - configuration loading and validation
			//   core   - the XMC server protocol, padding and relay
			srcDirs = ['lib/java', 'config/java', 'core/java']
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom attaches the remapped sources jar to this variant.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}

// Developer integration probe; run against a live dev server (see XmcProbe).
tasks.register('probe', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'xmc.probe.XmcProbe'
	// Vanilla servers reject clients whose handshake protocol differs from the
	// server's own, so a non-26.1 dev server needs -Pxmc.probe.protocol=<n>.
	String protocol = project.findProperty('xmc.probe.protocol')
	if (protocol) {
		systemProperty 'xmc.probe.protocol', protocol
	}
}

tasks.register('probeVanilla', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'xmc.probe.XmcProbe'
	args 'vanilla'
}

// Online-mode landing probe; credentials come from the environment:
//   XMC_TEST_EMAIL, XMC_TEST_PASSWORD, XMC_TEST_API (optional)
tasks.register('probeOnline', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'xmc.probe.XmcProbe'
	args 'vanilla-online'
}
